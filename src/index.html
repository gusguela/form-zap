<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Whatsapp</title>
</head>
<body>

    <main>
        <div id="logo">
            <img src="../icons/whatsapp.png" alt="logo-whatsapp">
            <h1>Empresa</h1>
        </div>
        <div id="caixa">

        </div>
        <div id="nome">
            <label>Seu nome</label>
            <input type="text" placeholder="Digite seu nome">
        </div>
        <div id="email">
            <label>Seu e-mail</label>
            <input type="text" placeholder="exemplo@gmail.com">
        </div>
        <div id="numero">
            <label>Seu WhatsApp</label>
            <input type="text" placeholder="+55 (88) 98888-8888">
        </div>
        <div id="button">
            <button>ir para o WhatsApp</button>
        </div>
    </main>

    <footer>
        <p>powered by Agendor</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
